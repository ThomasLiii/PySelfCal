# Quickstart, step 3: solve for the sky and the offsets, then coadd the calibrated frames.
#   ./selfcal_scripts/run.sh examples/quickstart/cal.toml
# Relative paths are used as written, i.e. relative to the directory you run from
# (the repository root in the quickstart).
task = "cal"
mode = "continuum"                    # a sky map, offsets per (frame, chunk), scalars per frame
output_dir = "quickstart_output"      # as in reproject.toml: the frames are read from there
run_name = "quickstart"
resolution_arcsec = 10.0              # required; the cal task reads the grid from ref.fits
cache_dir = "quickstart_output/cache/"  # scratch space; keep the trailing slash
suffix = "_quickstart"                # last part of the product names
apply_n_threads = 2                   # threads of the LSQR matrix-vector products

[instrument]                          # identical to reproject.toml
name = "grid"
tag = "Sim"
detector_shape = [64, 64]
chunks = [4, 4]
sci_ext = 1
dq_ext = 2

[params]                              # knobs of the mode
reg_weight = 0.1                      # smoothness between neighbouring chunks (the default)

[calibration]                         # building the linear system
apply_mask = true                     # leave out pixels flagged in the DQ mask
apply_weight = false                  # every pixel has the same weight
ignore_list = []                      # DQ bits that do NOT flag a pixel
outlier_thresh = 5.0                  # leave out pixels > 5 robust sigma from their frame's median
offset_regularization = true          # add the reg_weight smoothness rows
weighted_damping = true               # pull the sky toward zero (this fixes its zero point) ...
damp_weight = 0.001                   # ... with this weight per observation of each pixel
batch_size = 4                        # frames per worker task
max_workers = 2                       # worker processes

[lsqr]                                # the iterative solve
solver = "lsqr"
iter_lim = 200                        # maximum number of iterations
atol = 1e-8                           # stopping tolerances
btol = 1e-8
damp = 0                              # no extra damping of every unknown
precondition = true                   # scale every column of the system to unit norm

[mosaic]                              # coadding the calibrated frames
apply_mask = true
apply_weight = false
ignore_list = []
make_std_map = true                   # also write the per-pixel standard deviation
apply_sigma_clipping = true           # and a sigma-clipped mean ...
sigma = 3.0                           # ... clipped at 3 sigma
cache_intermediate = true             # prepare every frame once, reuse it in each pass
cache_batch_size = 4                  # frames per batch
coadd_batch_size = 4
max_workers = 2
