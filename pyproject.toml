[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "selfcal"
version = "0.1.0"
description = "Self-calibration pipeline for astronomical imaging (SPHEREx, Euclid)"
requires-python = ">=3.9"
dependencies = [
    "astropy",
    "h5py",
    "hdf5plugin",
    "matplotlib",
    "numpy",
    "opencv-python",
    "reproject",
    "scikit-image",
    "scipy",
    "threadpoolctl",
    "tqdm",
]

[project.optional-dependencies]
# mpsplines is git-only (not on PyPI), so it cannot be a core dependency. It is
# needed only for the optional external mean-preserving interpolator
# (interp_1d(method='mp_external')); the default offset rendering uses the
# in-tree scipy implementation. Imported lazily, so the core package installs
# and imports without it.
mpsplines = ["mpsplines @ git+https://github.com/jararias/mpsplines.git"]
dev = ["pytest"]

[tool.setuptools.packages.find]
# Refactor in progress (refactor/selfcal-package): code now lives in the
# lowercase ``selfcal`` package; ``SelfCal`` is kept as a thin back-compat
# shim package until all consumers are migrated. Both are discovered so
# ``import selfcal`` and ``import SelfCal`` both resolve.
include = ["selfcal*", "SelfCal*"]

[tool.setuptools.package-data]
# Ship the SPHEREx LVF arc-fit parameters with the wheel.
"selfcal.instruments.spherex" = ["data/lvf_params/*.npy"]
