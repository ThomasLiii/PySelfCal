name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.11 is the floor (core/coadd.py uses star-expression indexing).
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install (editable + dev extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # The pytest suite is self-contained: no /mnt or /data dependency, so it
      # runs anywhere. The data-dependent byte-equality gates (cache/refactor_gate/)
      # are NOT run here — they need the off-tree RAID reprojections and are run
      # manually on the processing host.
      - name: pytest (blocking)
        run: pytest -q

      # ruff + mypy are ADVISORY for now: the package carries pre-existing lint
      # (~220) and type (~120) findings that are being cleared on a dedicated
      # cleanup branch. Until that lands these steps report but do not fail CI,
      # so the signal is visible without blocking unrelated work. Flip
      # continue-on-error to false once the cleanup branch merges.
      - name: ruff (advisory)
        continue-on-error: true
        run: ruff check .

      - name: mypy (advisory)
        continue-on-error: true
        run: mypy
