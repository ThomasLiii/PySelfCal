# Frozen FIDUCIAL continuum recipe for the selfcal transfer-function runs
# (SPHEREx D1-D6) -- the same recipe behind the fiducial D1-D6 mosaics.
#
# You normally do NOT edit this file. run_transfer_function.sh fills in the six
# run-specific fields (detector, channels, reproj_override, output_dir, run_name
# -- plus it points the runner at your ref.fits) from its 6 inputs. The example
# values below are placeholders the launcher overwrites. Edit this file directly
# ONLY to deliberately deviate from the fiducial settings.

task = "cal"
mode = "continuum"                                   # the fiducial recipe

output_dir = "/mnt/md124/thomasli/selfcal/outputs"   # (set by launcher: OUTPUT_DIR)
run_name   = "TF_D3"                                  # (set by launcher: RUN_NAME)
resolution_arcsec = 6.2
suffix = ""
oversample = 2
apply_n_threads = 48
cache_dir = "/home/thomasli/selfcal-project/selfcal/cache/"

reproj_override = "/scratch/tf/D3_simsky_frames"     # (set by launcher: REPROJ_FRAME_DIR)
skip_mosaic = false                                  # produce the mosaic (what you compare against)
wavelength_coadd = false                             # wav_mean/wav_std are not read by the transfer function

[instrument]
name = "spherex"
detector = 3                                         # (set by launcher: DETECTOR)
num_sub = 10
num_ch = 34
num_col = 10
channels = [[17]]                                    # (set by launcher: CHANNEL)

# ---- Frozen fiducial recipe below (damp0p1 / reg0p1 / outThresh5 / sigma2 / polyK1) ----

[params]
poly_degree = 1
poly_weight = 0.5
reg_weight  = 0.1

[calibration]
apply_mask = true
apply_weight = false
outlier_thresh = 5.0
ignore_list = []
batch_size = 50
offset_regularization = true
weighted_damping = true
damp_weight = 0.1
max_workers = 48

[lsqr]
atol = 1e-06
btol = 1e-06
damp = 0
iter_lim = 50
precondition = true
solver = "lsqr"

[mosaic]
# The transfer function is read off MEAN_MAP, so the mosaic builds only that:
# one coadd pass over the frames, no intermediate cache (nothing reuses it),
# no std / sigma-clipped maps (and wavelength_coadd = false above, since the
# wav maps are per-pixel effective wavelength, not flux). The CALIBRATION recipe above is untouched:
# this only stops computing maps the transfer function does not read, and
# MEAN_MAP is the same map either way — to within the coadd's own
# run-to-run non-determinism, since it accumulates in worker-completion
# order and so is not bit-reproducible in any configuration. Set
# make_std_map/apply_sigma_clipping/cache_intermediate back to true to get
# the full fiducial mosaic.
apply_mask = true
apply_weight = false
make_std_map = false
apply_sigma_clipping = false
sigma = 2.0
ignore_list = [21]
cache_batch_size = 50
coadd_batch_size = 50
cache_intermediate = false
max_workers = 48
