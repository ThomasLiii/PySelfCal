# SEP S06 single-tile INIT experiment E3 (USER GO 2026-09-16): where are the J=4
# dim-sky stripes born? The J=4 INIT already carries them (aromatic 64-1024 px rms
# 0.72e-3 in the dim sky vs 0.53 for the J=2 INIT) and every later pass preserves
# them, so the fix has to reach the joint INIT solve. Each experiment changes ONE
# thing relative to the production S06 tile (sep_d4_npass_multiline_of.toml) and is
# judged by that same stripe statistic in the dim part of S06.
#   E3: J=2 sky model (continuum + aromatic only) on the same wide window -- does the
#   sky model change what the JOINT solve puts into the offsets?
task = "npass"
mode = "multiline"

output_dir = "/data3/thomasli/selfcal/outputs/"
run_name = "SPHEREx_SEP_2025_D{detector}_6p2arcsec"
resolution_arcsec = 6.2
cache_dir = "/home/thomasli/selfcal-project/selfcal/cache/"
suffix = "_multiline3_SEP6_E3j2wide_{tile}_iter300_polybasisD2noortho_NumCol3_outThresh5_sigma2"
oversample = 2
skip_mosaic = true
apply_n_threads = 32

[instrument]
name = "spherex"
detector = 4
num_sub = 10
num_ch = 34
num_col = 3
subch_window = [200, 321]
window_name = "WideAromE3"

[params]
subch_poly_degree = 2
subch_poly_lo = 200
subch_poly_hi = 320
line_fisher_threshold = 10.0

[[params.lines]]
name = "aromatic"
template_npz = "/home/thomasli/selfcal-project/selfcal/selfcal/instruments/spherex/data/line_templates/aromatic_3p289.npz"
damp_weight = 5e-3


[calibration]
apply_mask = true
apply_weight = true
outlier_thresh = 5.0
ignore_list = [21]
batch_size = 50
offset_regularization = true
weighted_damping = true
damp_weight = 0.1
damp_weight_line = 5e-3
max_workers = 48

[lsqr]
atol = 1e-06
btol = 1e-06
damp = 0
iter_lim = 300
precondition = true
solver = "lsqr"

[tiled]
ref_shape = [12343, 12303]
full_reproj_dir = "/mnt/md124/thomasli/selfcal/outputs/SPHEREx_SEP_2025_D4_6p2arcsec/reprojected"
frame_glob = "exp_*_det_00.h5"
frame_filter = "center"
halo = 0
nvme_subdir = "reproj_nvme_SEP_D4_npass"
stitched_suffix = "_multiline3_SEP6_E3j2wide_STITCHED_unused"
line = true
rss_guardrail = true
only_tiles = ["S06"]          # single-tile experiment; stitch skipped
# frame-balanced over the 19,269 centres (3,205-3,217 per tile), disjoint
tiles = [
  { name = "S01", bbox = [0, 5031, 0, 6294] },
  { name = "S02", bbox = [0, 5031, 6294, 12303] },
  { name = "S03", bbox = [5031, 6508, 0, 6376] },
  { name = "S04", bbox = [5031, 6508, 6376, 12303] },
  { name = "S05", bbox = [6508, 12343, 0, 5375] },
  { name = "S06", bbox = [6508, 12343, 5375, 12303] },
]

[passes]
n = 1                     # INIT only
order = "offset_first"
stop_tol = 0.0
sky_merge = "combine"
# the SEP field contains the LMC; keep the SEP recipe's tighter per-subchannel
# INIT clip rather than the NEP's whole-frame 5 sigma
init   = { outlier_thresh = 2.5, subch_clip = true, ignore_list = [21] }
sky    = { outlier_thresh = 5.0, subch_clip = true }
offset = { poly_degree = 4, outlier_thresh = 2.5, subch_clip = true, bright_cut = 0.05, min_pix = 5000 }
