# SEP D4 PAH 3.29um aromatic fit, N-PASS with OFFSET-FIRST ordering.
#
# Identical to sep_d4_npass.toml (same W/E INIT tiles, same wide-grid aromatic
# template, J = 2) except `[passes].order = "offset_first"`: INIT -> OFFSET ->
# SKY -> OFFSET -> SKY. The two INIT halves are independent joint solves, so
# they pick their own gauge along the near-null directions (line floor <->
# static detector pattern, level <-> per-frame scalars); re-fitting every frame
# against the one stitched INIT sky BEFORE the first exact sky removes the
# seam-adjacent lobes that the sky-first order leaves behind (established on the
# NEP big6 field 2026-09-11, see PIPELINE.md "N-pass alternating solve").
#
# The per-tile `suffix` matches the existing pass-1 cals, so run_tiled skips the
# INIT solves and only re-stitches under the new stitched_suffix. Products:
#   cal_..._HALVES_npass_wideG_of_pass{2off,3sky,4off,5sky}.h5
task = "npass"
mode = "multiline"          # == pahfit_lvf_polybasis with a single [[params.lines]] block
output_dir = "/data3/thomasli/selfcal/outputs/"
run_name = "SPHEREx_SEP_2025_D{detector}_6p2arcsec"
resolution_arcsec = 6.2
cache_dir = "/home/thomasli/selfcal-project/selfcal/cache/"
suffix = "_PAHfit_realistic_dampL5e-3_HALF_{tile}_p1off"
oversample = 2
skip_mosaic = true
apply_n_threads = 32

[instrument]
name = "spherex"
detector = 4
num_sub = 10
num_ch = 34
num_col = 3
subch_window = [200, 260]
window_name = "Aromatic_PAHfit_realistic_NEbSWEEP"

[params]
subch_poly_degree = 2
subch_poly_lo = 200
subch_poly_hi = 259
line_fisher_threshold = 10.0

[[params.lines]]
name = "pah_3p29"
# Wide-grid template (as in sep_d4_npass.toml): the pass-1 offsets were solved
# with the old to-3.47um grid and are reused as the alternation's start; the sky
# is refit with this template from the first exact sky on.
template_npz = "/home/thomasli/selfcal-project/selfcal/selfcal/instruments/spherex/data/line_templates/aromatic_3p289.npz"
damp_weight = 5e-3

[calibration]
apply_mask = true
apply_weight = true
outlier_thresh = 5.0
ignore_list = [21]
batch_size = 50
offset_regularization = true
weighted_damping = true
damp_weight = 0.1
damp_weight_line = 5e-3
max_workers = 48

[lsqr]
atol = 1e-06
btol = 1e-06
damp = 0
iter_lim = 100
precondition = true
solver = "lsqr"

[tiled]
ref_shape = [12343, 12303]
full_reproj_dir = "/mnt/md124/thomasli/selfcal/outputs/SPHEREx_SEP_2025_D4_6p2arcsec/reprojected"
frame_glob = "exp_*_det_00.h5"
frame_filter = "center"
halo = 0
# symlinks to the HDD frames (the SEP reproj lives on the RAID; stage_files skips existing paths)
nvme_subdir = "reproj_nvme_SEP_D4_npass"
stitched_suffix = "_PAHfit_realistic_dampL5e-3_HALVES_npass_wideG_of"
line = true
rss_guardrail = true
tiles = [
  { name = "WEST", bbox = [0, 12343, 0, 6177] },
  { name = "EAST", bbox = [0, 12343, 6177, 12303] },
]

[passes]
n = 5                     # INIT, OFFSET, SKY, OFFSET, SKY -- odd n ends on a sky
order = "offset_first"
stop_tol = 0.0
sky_merge = "combine"
init   = { outlier_thresh = 2.5, subch_clip = true, ignore_list = [21] }
sky    = { outlier_thresh = 5.0, subch_clip = true }
offset = { poly_degree = 4, outlier_thresh = 2.5, subch_clip = true, bright_cut = 0.05, min_pix = 5000 }
