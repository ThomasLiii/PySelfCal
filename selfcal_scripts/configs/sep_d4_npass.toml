# SEP D4 PAH 3.29um aromatic fit as an N-PASS alternating solve (task = "npass").
#
# Pass 1 = the legacy joint solve on two memory-sized tiles (W/E halves, centre-
# assigned frames -> disjoint) via run_tiled; then SKY (closed form from additive
# per-tile moment dumps, seam-free) and OFFSET (per-frame refit vs the one global
# sky, deg 4, bright cut) passes alternate. n = 4 reproduces the SEP 4-pass
# recipe; this config runs to n = 8 to record the per-pass monitors from which
# the default N is chosen (step 4 of the npass campaign, 2026-08-30).
#
# The suffix / job name match the existing W/E pass-1 cals
# (..._Aromatic_PAHfit_realistic_NEbSWEEP_PAHfit_realistic_dampL5e-3_HALF_{WEST,EAST}_p1off.h5),
# so run_tiled skips pass 1 and only stitches. Products:
#   cal_<frame>_<job>_PAHfit_realistic_dampL5e-3_HALVES_npass_pass{i}{sky|off}.h5
task = "npass"
mode = "multiline"          # == pahfit_lvf_polybasis with a single [[params.lines]] block
output_dir = "/data3/thomasli/selfcal/outputs/"
run_name = "SPHEREx_SEP_2025_D{detector}_6p2arcsec"
resolution_arcsec = 6.2
cache_dir = "/home/thomasli/selfcal-project/selfcal/cache/"
suffix = "_PAHfit_realistic_dampL5e-3_HALF_{tile}_p1off"
oversample = 2
skip_mosaic = true
apply_n_threads = 32

[instrument]
name = "spherex"
detector = 4
num_sub = 10
num_ch = 34
num_col = 3
subch_window = [200, 260]
window_name = "Aromatic_PAHfit_realistic_NEbSWEEP"

[params]
subch_poly_degree = 2
subch_poly_lo = 200
subch_poly_hi = 259
line_fisher_threshold = 10.0

[[params.lines]]
name = "pah_3p29"
# the template the existing pass-1 cals were built with (BC grid stops at 3.47um;
# the wide-grid package template line_templates/aromatic_3p289.npz is the
# candidate replacement -- a user decision, see workspace/spectral-npass/brief.md)
template_npz = "/home/thomasli/selfcal-project/selfcal/selfcal_scripts/spectral_4pass/data/pah_template.npz"
damp_weight = 5e-3

[calibration]
apply_mask = true
apply_weight = true
outlier_thresh = 5.0
ignore_list = [21]
batch_size = 50
offset_regularization = true
weighted_damping = true
damp_weight = 0.1
damp_weight_line = 5e-3
max_workers = 48

[lsqr]
atol = 1e-06
btol = 1e-06
damp = 0
iter_lim = 100
precondition = true
solver = "lsqr"

[tiled]
ref_shape = [12343, 12303]
full_reproj_dir = "/mnt/md124/thomasli/selfcal/outputs/SPHEREx_SEP_2025_D4_6p2arcsec/reprojected"
frame_glob = "exp_*_det_00.h5"
frame_filter = "center"
halo = 0
# symlinks to the HDD frames (the SEP reproj lives on the RAID; stage_files skips existing paths)
nvme_subdir = "reproj_nvme_SEP_D4_npass"
stitched_suffix = "_PAHfit_realistic_dampL5e-3_HALVES_npass"
line = true
rss_guardrail = true
tiles = [
  { name = "WEST", bbox = [0, 12343, 0, 6177] },
  { name = "EAST", bbox = [0, 12343, 6177, 12303] },
]

[passes]
n = 8
stop_tol = 0.0
sky_merge = "combine"
init   = { outlier_thresh = 2.5, subch_clip = true, ignore_list = [21] }
sky    = { outlier_thresh = 5.0, subch_clip = true }
offset = { poly_degree = 4, outlier_thresh = 2.5, subch_clip = true, bright_cut = 0.05, min_pix = 5000 }
