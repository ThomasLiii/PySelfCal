# NEP D4 multi-line (aromatic + aliphatic + plateau, J = 4) N-PASS PROBE on the
# 1k deep-centre frames (symlinks in cache/reproj_nep1k_multiline). Pass 1 is the
# existing iter-300 probe cal (same suffix -> run_calibration skips it); passes
# 2-4 are the closed-form SKY / per-frame OFFSET / SKY steps. Step 5 of the
# npass campaign (2026-08-30): the continuum-plateau degeneracy (Gram 0.79)
# under an EXACT sky solve is the physics risk; judge all four blocks here
# before the full-NEP run.
task = "npass"
mode = "multiline"
output_dir = "/mnt/md124/thomasli/selfcal/outputs/"
run_name = "SPHEREx_NEP_2026W17_D{detector}_6p2arcsec"
resolution_arcsec = 6.2
cache_dir = "/home/thomasli/selfcal-project/selfcal/cache/"
reproj_override = "/home/thomasli/selfcal-project/selfcal/cache/reproj_nep1k_multiline"
suffix = "_multiline3_probe1k_iter300_polybasisD2noortho_NumCol3_outThresh5_sigma2"
oversample = 2
skip_mosaic = true
apply_n_threads = 32

[instrument]
name = "spherex"
detector = 4
num_sub = 10
num_ch = 34
num_col = 3
subch_window = [200, 321]
window_name = "Multiline3"

[params]
subch_poly_degree = 2
subch_poly_lo = 200
subch_poly_hi = 320
line_fisher_threshold = 10.0

[[params.lines]]
name = "aromatic"
template_npz = "/home/thomasli/selfcal-project/selfcal/selfcal/instruments/spherex/data/line_templates/aromatic_3p289.npz"
damp_weight = 5e-3

[[params.lines]]
name = "aliphatic"
template_npz = "/home/thomasli/selfcal-project/selfcal/selfcal/instruments/spherex/data/line_templates/aliphatic_3p400.npz"
damp_weight = 5e-3

[[params.lines]]
name = "plateau"
template_npz = "/home/thomasli/selfcal-project/selfcal/selfcal/instruments/spherex/data/line_templates/plateau_3p470.npz"
damp_weight = 5e-3

[calibration]
apply_mask = true
apply_weight = true
outlier_thresh = 5.0
ignore_list = [21]
batch_size = 50
offset_regularization = true
weighted_damping = true
damp_weight = 0.1
damp_weight_line = 5e-3
max_workers = 24

[lsqr]
atol = 1e-06
btol = 1e-06
damp = 0
iter_lim = 300
precondition = true
solver = "lsqr"

[passes]
n = 4
stop_tol = 0.0
sky_merge = "combine"
# pass 1 = the legacy probe (whole-frame 5-sigma clip); no init overrides so the
# existing cal is reused as-is
sky    = { outlier_thresh = 5.0, subch_clip = true }
offset = { poly_degree = 4, outlier_thresh = 2.5, subch_clip = true, bright_cut = 0.05, min_pix = 5000 }
