# Production NEP D4 continuum calibration (replaces drivers/run_cal.py).
# Aromatic + Aliphatic subchannel windows, NumCol=10, full mosaic + wavelength.
task = "cal"
mode = "continuum"

output_dir = "/mnt/md124/thomasli/selfcal/outputs/"
run_name = "SPHEREx_NEP_2026W17_D{detector}_6p2arcsec"
resolution_arcsec = 6.2
cache_dir = "/home/thomasli/selfcal-project/selfcal/cache/"
suffix = "_damp0p1_reg0p1_outThresh1_sigma2_polyK1"
oversample = 1
staging = "copy"
keep_nvme = false
hdd_io_limit = 20
apply_n_threads = 48

[instrument]
name = "spherex"
detector = 4
num_sub = 10
num_ch = 34
num_col = 10
windows = ["Aromatic", "Aliphatic"]

[params]
poly_degree = 1
poly_weight = 0.5
reg_weight = 0.1

[calibration]
apply_mask = true
apply_weight = true
outlier_thresh = 5.0
ignore_list = []
batch_size = 50
offset_regularization = true
weighted_damping = true
damp_weight = 0.1
max_workers = 48

[lsqr]
atol = 1e-06
btol = 1e-06
damp = 0
iter_lim = 50
precondition = true
solver = "lsqr"

[mosaic]
apply_mask = true
apply_weight = false
make_std_map = true
apply_sigma_clipping = true
sigma = 2.0
ignore_list = [21]
cache_batch_size = 50
coadd_batch_size = 50
cache_intermediate = true
max_workers = 48
