# unify gate: N-pass n=3 probe (INIT, SKY, OFFSET) — the production multiline recipe on the
# 150-frame D4 fixture, window [200,321], iter_lim 20. Covers the npass scheduler, the K=0
# closed-form SKY pass (moment dump + combine) and the per-frame OFFSET refit, none of which
# the cal gates touch. Golden generated on the untouched tree (main @ 30aa7f5).
task = "npass"
mode = "spectral_polybasis"

output_dir = "/mnt/md124/thomasli/selfcal/outputs/"
run_name = "SPHEREx_NEP_2026W17_D{detector}_6p2arcsec"
resolution_arcsec = 6.2
cache_dir = "/home/thomasli/selfcal-project/selfcal-memopt/cache/"
suffix = "_unify_npass3_gate"
oversample = 2
apply_n_threads = 48
reproj_override = "/home/thomasli/selfcal-project/selfcal/cache/reproj_nvme_pahfit_sanity_1k"
n_frames = 150
skip_mosaic = true

[instrument]
name = "spherex"
detector = 4
num_sub = 10
num_ch = 34
num_col = 3
subch_window = [200, 321]
window_name = "Multiline3"

[params]
spectral_poly_degree = 2
spectral_poly_lo = 200
spectral_poly_hi = 320
line_fisher_threshold = 10.0

[[params.lines]]
name = "aromatic"
template_npz = "/home/thomasli/selfcal-project/selfcal-memopt/selfcal/instruments/spherex/data/line_templates/aromatic_3p289.npz"
damp_weight = 5e-3

[[params.lines]]
name = "aliphatic"
template_npz = "/home/thomasli/selfcal-project/selfcal-memopt/selfcal/instruments/spherex/data/line_templates/aliphatic_3p400.npz"
damp_weight = 5e-3

[[params.lines]]
name = "plateau"
template_npz = "/home/thomasli/selfcal-project/selfcal-memopt/selfcal/instruments/spherex/data/line_templates/plateau_3p470.npz"
damp_weight = 5e-3

[calibration]
apply_mask = true
apply_weight = true
outlier_thresh = 5.0
ignore_list = [21]
batch_size = 50
offset_regularization = true
weighted_damping = true
damp_weight = 0.1
damp_weight_line = 5e-3
max_workers = 48

[lsqr]
atol = 1e-06
btol = 1e-06
damp = 0
iter_lim = 20
precondition = true
solver = "lsqr"

[passes]
n = 3
order = "sky_first"
sky = { outlier_thresh = 5.0, subch_clip = true }
offset = { poly_degree = 2, outlier_thresh = 2.5, subch_clip = true, bright_cut = 0.05, min_pix = 5000 }
