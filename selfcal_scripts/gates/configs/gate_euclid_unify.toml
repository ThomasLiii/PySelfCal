# unify gate: the Euclid EDFN recipe (small scale) through the runner, vs the golden made by the
# script path (euclid_pipeline.py --subset 3 --n-side 40 --perframe-stripes --perframe-damp 0.3
# --iter-lim 30, float64 solve, 8 threads). Reuses the golden run's reprojected frames.
task = "cal"
mode = "model"

output_dir = "/mnt/md124/thomasli/selfcal/outputs/"
run_name = "EDFN_Y_1p5arcsec_unifygolden"
resolution_arcsec = 1.5
cache_dir = "/home/thomasli/selfcal-project/selfcal-memopt/cache/"
suffix = "_unify_gate"
oversample = 1
apply_n_threads = 8
wavelength_coadd = false
reproj_override = "/mnt/md124/thomasli/selfcal/outputs/EDFN_Y_1p5arcsec_unifygolden/reprojected"

[instrument]
name = "euclid"
band = "Y"
chunks = 40
strips = 40

[model]
scalar = true
mosaic = "full"

[[model.sky]]
name = "continuum"

[[model.offset]]
map = "grid"
kind = "grouped"
groups = "detector"
reg_weight = 0.1
adjacency = ["row", "col"]
mean_zero = true
exact_group_rows = true

[[model.offset]]
map = "col_strips"
kind = "free"
reg_weight = 0.0
adjacency = []
damp = 0.3

[[model.offset]]
map = "row_strips"
kind = "free"
reg_weight = 0.0
adjacency = []
damp = 0.3

[calibration]
apply_mask = true
apply_weight = false
outlier_thresh = 5.0
ignore_list = [11, 15]
batch_size = 8
offset_regularization = true
weighted_damping = true
damp_weight = 0.1
max_workers = 8

[lsqr]
atol = 1e-6
btol = 1e-6
damp = 0
iter_lim = 30
precondition = true
solver = "lsqr"
use_float32 = false

[mosaic]
apply_offset = true
valid_chunk_thresh = 0
apply_mask = true
apply_weight = false
make_std_map = true
apply_sigma_clipping = true
sigma = 2.0
ignore_list = [11, 15]
cache_intermediate = true
cache_batch_size = 8
coadd_batch_size = 8
max_workers = 8
