# Runner byte-equality gate — continuum (mirrors benchmarks/regress_cal.py).
# D3 Ch17 NumCol3, first 300 frames, no-poly adjacency block, no mosaic.
# Diff the resulting cal against goldens/cal_Detector3_..._Ch17_gate_golden.h5.
task = "cal"
mode = "continuum"

output_dir = "/mnt/md124/thomasli/selfcal/outputs/"
run_name = "SPHEREx_nep_qr2_det{detector}_6p2arcsec"
resolution_arcsec = 6.2
suffix = "_unify_gate"
oversample = 2
apply_n_threads = 48
reproj_override = "/home/thomasli/selfcal-project/selfcal/cache/reproj_nvme_SPHEREx_nep_qr2_det3_6p2arcsec"
n_frames = 300
skip_mosaic = true

[instrument]
name = "spherex"
detector = 3
num_sub = 10
num_ch = 34
num_col = 3
channels = [[17]]

[params]
reg_weight = 0.1
# no poly_weight => no column poly-constraint (matches the regress_cal golden)

[calibration]
apply_mask = true
apply_weight = false
outlier_thresh = 5.0
ignore_list = []
batch_size = 50
offset_regularization = true
weighted_damping = true
damp_weight = 0.1
max_workers = 48

[lsqr]
atol = 1e-06
btol = 1e-06
damp = 0
iter_lim = 50
precondition = true
solver = "lsqr"
