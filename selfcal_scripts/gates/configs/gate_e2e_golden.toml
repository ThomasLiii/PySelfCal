# NEP D5 continuum calibration (replaces experiments/run_cal_d5.py).
# Channels 23..34, NumCol=10, oversample=2, no apply_weight.
task = "cal"
mode = "continuum"

output_dir = "/mnt/md124/thomasli/selfcal/outputs/"
run_name = "SPHEREx_nep_qr2_det{detector}_6p2arcsec"
resolution_arcsec = 6.2
cache_dir = "/home/thomasli/selfcal-project/selfcal-memopt/workspace/coaddopt/cache/"
suffix = "_unify_e2e_golden"
oversample = 2
staging = "reuse"
keep_nvme = true
reproj_override = "/home/thomasli/selfcal-project/selfcal-memopt/cache/reproj_nvme_SPHEREx_nep_qr2_det3_6p2arcsec"
n_frames = 300
hdd_io_limit = 20
apply_n_threads = 48

[instrument]
name = "spherex"
detector = 3
num_sub = 10
num_ch = 34
num_col = 3
channels = [[17]]

[params]
poly_degree = 1
poly_weight = 0.5
reg_weight = 0.1

[calibration]
apply_mask = true
apply_weight = false
outlier_thresh = 5.0
ignore_list = []
batch_size = 50
offset_regularization = true
weighted_damping = true
damp_weight = 0.1
max_workers = 48

[lsqr]
atol = 1e-06
btol = 1e-06
damp = 0
iter_lim = 50
precondition = true
solver = "lsqr"

[mosaic]
apply_mask = true
apply_weight = false
make_std_map = true
apply_sigma_clipping = true
sigma = 2.0
ignore_list = [21]
cache_batch_size = 50
coadd_batch_size = 50
cache_intermediate = true
max_workers = 48
